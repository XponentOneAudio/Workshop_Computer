draft: false
Name: 8mu Ripple
short-description: Divided-noise synth with feedback, played from the faders of an 8mu
Language: C++ (Pico SDK + ComputerCard)
Creator: Martyn Quickenden
Version: "0.2.0"
Status: Beta
License: MIT
date-created: 2026-10-30
date-updated: 2026-10-30

tags:
  - noise
  - synth-voice
  - lfsr
  - divider
  - logic
  - filter
  - midi-host

summary: |
  A clock steps a shift-register noise source, and the rising edges of the noise bit drive five
  dividers: binary /2 to /32 by default, or any ratio from 2 to 37 including the primes. The raw bit,
  the divider outputs and four XOR/AND/OR/AND-NOT combinations of them are mixed on the 8mu's faders,
  fed back to the clock pitch, and sent through a stereo filter (lowpass, bandpass, highpass, notch,
  4-pole ladder or tuned comb) whose cutoff is modulated by the clock. Tap the 8mu's buttons to step
  through seven fader pages, covering logic, LFSR length, noise colour, hiss, filter types, stereo
  panning, divide ratios, count length and tilt control. A fourth button locks the noise pattern into a loop.

panel:
  inputs:
    - id: AudioIn1
      name: Bit Source
      type: audio
      description: When patched, a comparator on this input replaces the noise bit, so the dividers divide any audio
    - id: AudioIn2
      name: Clock FM
      type: audio
      description: Exponential FM of the clock, about +-2 octaves
    - id: CVIn1
      name: Pitch
      type: cv
      description: Clock pitch, about 1V/octave, added to the main knob
    - id: CVIn2
      name: Cutoff
      type: cv
      description: Filter cutoff, about 1V/octave, added to knob X
    - id: PulseIn1
      name: Ext Clock
      type: pulse
      description: When patched, rising edges step the noise register instead of the internal clock
    - id: PulseIn2
      name: Reset
      type: pulse
      description: Reseeds the noise register and clears the dividers
  outputs:
    - id: AudioOut1
      name: Left Out
      type: audio
      description: Filtered mix, left
    - id: AudioOut2
      name: Right Out
      type: audio
      description: Filtered mix, right
    - id: CVOut1
      name: Random CV
      type: cv
      description: Stepped random voltage, new value each counter cycle
    - id: CVOut2
      name: Noise Mod CV
      type: cv
      description: The feedback signal driving the clock pitch
    - id: PulseOut1
      name: Cycle
      type: pulse
      description: 5ms trigger each time the counter completes a cycle
    - id: PulseOut2
      name: Noise Bit
      type: pulse
      description: The raw noise bit (/1)

controls:
  knobs:
    - main:
        name: Clock Pitch
        description: About 0.5Hz to 32kHz
      x:
        name: Cutoff
        description: Filter cutoff or comb pitch, 20Hz to 16kHz; with clock tune, an interval of +-4 octaves from the clock
      y:
        name: Resonance
        description: Filter resonance, or comb feedback
  switch:
    up:
      name: Filter A
      description: Filter type A, set on the Filter page (default lowpass)
    middle:
      name: Filter B
      description: Filter type B, set on the Filter page (default bandpass)
    down:
      name: Reset
      description: Momentary. Reseeds the noise register and clears the dividers
  leds:
    - display: list
      items:
        - id: LED0
          name: /1
          description: Raw noise bit
        - id: LED1
          name: /2
          description: Counter output /2
        - id: LED2
          name: /4
          description: Counter output /4
        - id: LED3
          name: /8
          description: Counter output /8
        - id: LED4
          name: /16
          description: Counter output /16
        - id: LED5
          name: /32
          description: Counter output /32

host:
  usb:
    - name: Music Thing Modular 8mu
      role: controller
      description: >
        Optional, plugged into the Computer's USB socket. Seven fader pages with soft takeover: tap
        button 1 for Play/Logic, button 2 for Noise/Filter, button 3 for Divide/Ratios/Motion, tapping
        again to step through each group. Button 4 toggles loop lock. Without an 8mu, the fader
        parameters keep their defaults.
