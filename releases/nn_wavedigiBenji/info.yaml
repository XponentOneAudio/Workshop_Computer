draft: true
Name: WDF Benjolin
short-description: Benjolin with cross FM, and a wave digital filter model of its rungler DAC and resonant, self-oscillating filter
summary: |
  A Benjolin after Rob Hordijk: two cross-modulating triangle-core
  oscillators, a rungler (8-bit shift register clocked by oscillator 2, fed
  by oscillator 1), a band-limited PWM comparator and a resonant filter. The analogue parts that shape the sound
  are modelled as Wave Digital Filters, in fixed point.

    - The rungler DAC is the R/2R/4R network summing into a smoothing
      capacitor.
    - The filter is a voltage-controlled series RLC with a nonlinear root: a
      negative resistance sets resonance (self-oscillating at the top of its
      range) and a current limiter caps the amplitude.

  Tap Z down to step through three knob pages:

    1. Osc 1 rate, rungler > Osc 1, FM Osc 2 > Osc 1
    2. Osc 2 rate, rungler > Osc 2, FM Osc 1 > Osc 2
    3. Cutoff, rungler > cutoff, resonance

  Parameters pick up when the knob reaches them, so nothing jumps.
Language: C++ (Pico SDK + ComputerCard)
Creator: TBD
Version: "1.0"
Status: WIP
License: MIT
date-created: 2026-10-28
date-updated: 2026-10-28

tags:
  - benjolin
  - rungler
  - chaos
  - filter
  - wave-digital-filter

panel:
  inputs:
    - id: PulseIn1
      name: Rungler Clock
      description: When patched, rising edges clock the rungler instead of oscillator 2
      type: pulse
    - id: PulseIn2
      name: Loop Gate
      description: While high, flips the rungler between chaos and loop
      type: pulse
    - id: AudioIn1
      name: Filter In
      description: When patched, replaces the PWM comparator as the filter input
      type: audio
    - id: AudioIn2
      name: Cutoff CV
      description: Filter cutoff CV, about 1V/oct, added to the knob and rungler
      type: cv
    - id: CVIn1
      name: Osc 1 CV
      description: Oscillator 1 pitch CV, about 1V/oct
      type: cv
    - id: CVIn2
      name: Osc 2 CV
      description: Oscillator 2 pitch CV, about 1V/oct
      type: cv
  outputs:
    - id: AudioOut1
      name: Filter LP
      description: Lowpass output of the WDF filter (the main Benjolin voice)
      type: audio
    - id: AudioOut2
      name: Filter BP
      description: Bandpass output of the WDF filter
      type: audio
    - id: CVOut1
      name: Rungler
      description: Stepped rungler voltage from the WDF DAC, 0 to +6V
      type: cv
    - id: CVOut2
      name: Osc 2 Triangle
      description: Oscillator 2 triangle, bipolar
      type: cv
    - id: PulseOut1
      name: Osc 1 Pulse
      description: Oscillator 1 square wave
      type: pulse
    - id: PulseOut2
      name: Osc 2 Pulse
      description: Oscillator 2 square wave (the rungler clock)
      type: pulse

controls:
  switch:
    up:
      name: Loop
      description: The rungler recirculates its pattern
    middle:
      name: Chaos
      description: The rungler takes new data from oscillator 1, XORed with its output
    down:
      name: Page
      description: Tap down to step to the next knob page (1, 2, 3, back to 1)
  knobs:
    - main:
        name: Osc 1 rate / Osc 2 rate / Cutoff
        description: "Page 1: oscillator 1 rate, 0.5 Hz to about 6 kHz. Page 2: oscillator 2 rate, same range. Page 3: filter cutoff, 30 Hz to 15 kHz."
      x:
        name: Rungler depth
        description: "Rungler modulation depth, up to 5 octaves, into oscillator 1 (page 1), oscillator 2 (page 2) or the filter cutoff (page 3)."
      y:
        name: Cross FM / Resonance
        description: "Page 1: FM of oscillator 1 by oscillator 2's triangle, up to +/-4 octaves. Page 2: FM of oscillator 2 by oscillator 1. Page 3: filter resonance, self-oscillating in roughly the top tenth of the range."
  leds:
    - display: list
      items:
        - id: LED0
          name: Page 1
          description: Lit while page 1 (oscillator 1) is selected
        - id: LED2
          name: Page 2
          description: Lit while page 2 (oscillator 2) is selected
        - id: LED4
          name: Page 3
          description: Lit while page 3 (filter) is selected
        - id: LED1
          name: Rungler
          description: Rungler voltage
        - id: LED3
          name: Comparator
          description: PWM comparator state
        - id: LED5
          name: LP level
          description: Filter lowpass output level
