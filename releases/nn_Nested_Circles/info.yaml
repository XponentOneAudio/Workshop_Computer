summary: |
  Two ways of building complex sounds from sine waves, made to be looked at
  as well as listened to. Hold the switch down for a second (or the 8mu's
  button D) to swap between them. The web app animates each, slowed right
  down, with its spectrum, explanations and links to read further, and plays
  them in the browser too.<br><br>

  <b>Additive.</b> Eight sine waves - partials - are added together. Each is a
  circle turning at its own speed, and the circles are nested, each riding on
  the rim of the one before, so the outermost point traces a more complicated
  waveform: a Fourier series. The 8mu's faders are the eight partials and its
  buttons choose what they change: A is LEVEL, B is PHASE and C is FREQUENCY,
  which defaults to the harmonic series, either side detuning a partial by up
  to 12 semitones. D loads the next of six shapes: saw, square, triangle,
  sine, pulse and bell. X fades the partials in one by one and Y stretches
  the harmonic series as stiff piano strings do.<br><br>

  <b>FM.</b> Two operators: a modulator bends a carrier, in one of four ways,
  chosen by the 8mu's buttons - A linear FM (stopping at 0Hz, as an ordinary
  oscillator does), B exponential FM (in octaves, as 1V/oct), C through-zero
  FM, and D phase modulation, as in Yamaha's DX7. The faders set the carrier
  and modulator ratios, fine tune, depth, feedback and a decaying envelope on
  depth and level, triggered at Pulse In 1. Six examples - vibrato, clarinet,
  electric piano, bell, feedback and a deep 1:1 to compare the four types -
  load from Pulse In 2.<br><br>

  After a page, mode or example change the faders pick up, so nothing jumps.
  Without an 8mu the card starts as a sawtooth (additive) or the clarinet
  (FM), under the panel controls.

panel:
  inputs:
    - id: AudioIn1
      name: Stretch / FM in
      type: audio
      description: "Additive: stretch, added to Y. FM: an external modulator, added to the modulator."
    - id: AudioIn2
      name: Unused
    - id: CVIn1
      name: Pitch
      type: cv
      description: 1V/oct, added to the Main knob.
    - id: CVIn2
      name: Partials / Depth
      type: cv
      description: "Added to the X knob: partials (additive) or depth (FM)."
    - id: PulseIn1
      name: Sync / Trigger
      type: pulse
      description: "Additive: every circle back to its start phase. FM: starts the envelope, with both operators from 0."
    - id: PulseIn2
      name: Next shape / example
      type: pulse
      description: Loads the next additive shape, or the next FM example.
  outputs:
    - id: AudioOut1
      name: Out
      type: audio
      description: "Additive: the sum of the partials, the height of the outermost circle. FM: the carrier, modulated."
    - id: AudioOut2
      name: Shadow / Modulator
      type: audio
      description: "Additive: the partials as cosines - into a scope's X-Y mode with Audio Out 1, it draws the circles' path. FM: the modulator."
    - id: CVOut1
      name: Pitch
      type: cv
      description: 1V/oct, 0V at middle C.
    - id: CVOut2
      name: Unused
    - id: PulseOut1
      name: Square
      type: pulse
      description: Square wave at the pitch.
    - id: PulseOut2
      name: Unused

controls:
  switch:
    up:
      name: Lock / Drone
      description: "Additive: harmonic lock, every partial at its exact harmonic. FM: drone, the envelope held at its peak."
    middle:
      name: Free / Envelope
      description: "Additive: the FREQUENCY page and stretch apply. FM: the envelope decays after each trigger at Pulse In 1."
    down:
      name: Next / Swap mode
      description: "Momentary. A tap loads the next additive shape, or the next FM type. Held for a second, it swaps between additive and FM."
  knobs:
    - main:
        name: Pitch
        description: C1 to C7.
      x:
        name: Partials / Depth
        description: "Additive: how many partials sound, 1 to 8, each fading in. FM: depth, added to fader 4."
      y:
        name: Stretch / Ratio
        description: "Additive: stretch, partial n at n^(1 + stretch) times the fundamental, 0 to 0.5. FM: up to 12 steps up the modulator ratio list."
  leds:
    - display: list
      items:
        - id: LED0
          name: Page or type A
          description: "Additive with an 8mu or the web app: LEDs 0-2 show the page (A-C) and LED 3 flashes when a shape loads; without, LEDs 0-3 show partials 1-4's levels. FM: LEDs 0-3 show the FM type. All light briefly on a mode swap."
        - id: LED1
          name: Page or type B
        - id: LED2
          name: Page or type C
        - id: LED3
          name: Shape or type D
        - id: LED4
          name: Square / Envelope
          description: "Additive: follows Pulse Out 1. FM: the envelope."
        - id: LED5
          name: 8mu / web app
          description: Lit while an 8mu, or the web app, is connected.
