draft: true
Name: WDF Benjolin 2
short-description: Component-level circuit model of the Benjolin Gorga, with WDF capacitors and its real SSM2164 oscillators, rungler and filter
summary: |
  A model of the Benjolin Gorga (a eurorack v1.6 Benjolin after Rob Hordijk
  and Forestcaver), built from its KiCad netlist and BOM. Every resistor,
  capacitor and op-amp stage that shapes the sound is in the model with its
  real value. Capacitors are Wave Digital Filter one-ports; the SSM2164 VCA
  integrators, precision rectifiers, R-2R rungler DAC, transistor XOR and
  state-variable filter are solved from the circuit each sample.

  Details from the real circuit include:
    - the filter modulating its own cutoff from its bandpass output
    - the rungler CV leaking into the filter input
    - the clipping x5 output stage
    - the Chaos pot and SW1 locking the rungler into 8- or 16-step loops

  Tap Z down to step through four knob pages:
    1. Osc 1 rate, rungler > Osc 1, Osc 1 CV / cross mod
    2. Osc 2 rate, rungler > Osc 2, Osc 2 CV / cross mod
    3. Cutoff, rungler > filter, resonance
    4. Chaos, filter CV depth, output level
  Z up connects the Chaos pot (SW1). Knobs pick up their value so nothing jumps.
Language: C++ (Pico SDK + ComputerCard)
Creator: TBD
Version: "0.1"
Status: WIP
License: CC BY-NC 4.0
